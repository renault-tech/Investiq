name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API — unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run unit tests
        run: pytest tests/unit -q
        env:
          DATABASE_URL: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder
          ENABLE_SCHEDULER: "false"
      - name: Run integration tests (with coverage)
        run: pytest tests/integration -q --cov=src --cov-report=xml --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/investiq_test
          TEST_REDIS_URL: redis://localhost:6379/1
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  web:
    name: Web — typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Unit tests
        run: npm run test --workspace apps/web
      - name: Build
        run: npm run build --workspace apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t investiq-api:ci apps/api
      - name: Build web image
        # Context is the repo root: npm workspaces need the root
        # package-lock.json and Next's standalone output keeps the apps/web/
        # path prefix.
        run: docker build -t investiq-web:ci -f apps/web/Dockerfile .
