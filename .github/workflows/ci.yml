name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API — unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run unit tests
        run: pytest tests/unit -q
        env:
          DATABASE_URL: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder
          ENABLE_SCHEDULER: "false"
      - name: Run integration tests (with coverage)
        run: pytest tests/integration -q --cov=src --cov-report=xml --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/investiq_test
          TEST_REDIS_URL: redis://localhost:6379/1
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  web:
    name: Web — typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Unit tests
        run: npm run test --workspace apps/web
      - name: Build
        run: npm run build --workspace apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e .
      - name: Generate ephemeral API secrets (.env)
        # RS256 keypair + Fernet key, fresh per run — no repo secrets to
        # manage, same "generate on the fly" approach the integration test
        # suite's conftest.py already uses when these env vars aren't set.
        working-directory: apps/api
        run: |
          python -c "
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          priv = key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.TraditionalOpenSSL,
              encryption_algorithm=serialization.NoEncryption(),
          ).decode()
          pub = key.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          ).decode()
          with open('.env', 'w') as f:
              f.write('DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/investiq\n')
              f.write('REDIS_URL=redis://localhost:6379\n')
              f.write(f'JWT_PRIVATE_KEY=\"{priv.replace(chr(10), chr(92)+chr(110))}\"\n')
              f.write(f'JWT_PUBLIC_KEY=\"{pub.replace(chr(10), chr(92)+chr(110))}\"\n')
              f.write(f'ENCRYPTION_KEY={Fernet.generate_key().decode()}\n')
              f.write('FRONTEND_URL=http://localhost:3000\n')
              f.write('ENABLE_SCHEDULER=false\n')
          "
      - name: Run API migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Start API
        working-directory: apps/api
        run: nohup uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "API did not become ready in time" >&2
          cat /tmp/api.log
          exit 1
      - name: Install web dependencies
        run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run E2E tests
        run: npm run test:e2e --workspace apps/web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t investiq-api:ci apps/api
      - name: Build web image
        # Context is the repo root: npm workspaces need the root
        # package-lock.json and Next's standalone output keeps the apps/web/
        # path prefix.
        run: docker build -t investiq-web:ci -f apps/web/Dockerfile .
