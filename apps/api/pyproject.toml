[project]
name = "investiq-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pydantic[email]>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "cryptography>=42.0.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "apscheduler>=3.10.4",
  "tzdata>=2024.1",
  "slowapi>=0.1.9",
  "resend>=0.8.0",
  "anthropic>=0.28.0",
  # Teto de major version — ver o comentário equivalente em requirements.txt:
  # sem ele, um build sem lockfile pode saltar pra uma major nova (aconteceu
  # com openai 1.x -> 3.x) e quase dobrar o peso instalado da SDK.
  "openai>=1.30.0,<2.0.0",
  # google-genai também engorda bastante dentro da própria 1.x — travado
  # num ponto mais cedo pra caber no limite de função do Vercel.
  "google-genai>=1.0.0,<1.35.0",
  "python-dateutil>=2.9.0",
  "pdfplumber>=0.11.0",
  "fpdf2>=2.7.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "pytest-cov>=5.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
